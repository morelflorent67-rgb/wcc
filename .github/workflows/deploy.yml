# Déploiement manuel vers l'hébergement (FTPS). Rien ne part tant qu'on ne le lance pas à la main
# (onglet « Actions » du dépôt > « Déployer le site » > « Run workflow »).
#
# Aucun secret n'est configuré pour l'instant : le workflow ne peut donc rien publier.
# À la mise en ligne, créer dans Settings > Secrets and variables > Actions :
#   FTP_SERVER   (ex. ftp.cluster0XX.hosting.ovh.net)
#   FTP_USERNAME
#   FTP_PASSWORD
# Voir docs/DEPLOIEMENT.md.
name: Déployer le site

on:
  # Déploiement automatique à chaque push sur main, UNIQUEMENT si la variable SITE_URL est définie
  # (Settings > Secrets and variables > Actions > Variables : SITE_URL, PUBLIC_INDEXABLE).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_url:
        description: "Adresse publique du site (ex. https://www.mon-domaine.fr)"
        required: true
      indexable:
        description: "Autoriser l'indexation par les moteurs de recherche"
        type: boolean
        default: false
      dry_run:
        description: "Essai à blanc : liste ce qui serait envoyé, sans rien envoyer"
        type: boolean
        default: true
      server_dir:
        description: "Dossier distant (laisser ./ avec l'utilisateur FTP dédié ; www/ avec le compte principal OVH)"
        default: "./"

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Construire le site
        run: npm run build
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
          PUBLIC_INDEXABLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.indexable) && 'true' || (github.event_name == 'push' && vars.PUBLIC_INDEXABLE) || 'false' }}
      # config.php de production : contenu du secret API_CONFIG_PHP (jamais dans le dépôt), écrit dans dist/ juste avant l'envoi.
      # Sans ce secret, le fichier déjà présent sur le serveur n'est pas touché.
      - name: Ajouter api/config.php
        env:
          API_CONFIG_PHP: ${{ secrets.API_CONFIG_PHP }}
        run: |
          if [ -n "$API_CONFIG_PHP" ]; then printf '%s\n' "$API_CONFIG_PHP" > dist/api/config.php; echo "config.php ajouté"; else echo "pas de secret API_CONFIG_PHP : config.php du serveur conservé"; fi
      # OVH mutualisé refuse le FTPS de l'action FTP-Deploy (« 500 This security scheme is not implemented ») :
      # envoi par SFTP (port 22) avec lftp. Sans --delete : rien n'est jamais supprimé sur le serveur
      # (config.php et le stockage privé restent intacts ; config.php et storage/ ne sont de toute façon pas dans dist/).
      - name: Envoyer par SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # L'utilisateur FTP dédié (OVH) démarre déjà dans le dossier racine du site : on envoie dans « ./ ».
          # (La variable FTP_DIR n'est plus utilisée ; pour un compte principal, passer server_dir = www/ en lancement manuel.)
          REMOTE_DIR: ${{ inputs.server_dir || './' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          OPTS="--reverse --only-newer --parallel=4 --verbose"
          if [ "$DRY_RUN" = "true" ]; then OPTS="$OPTS --dry-run"; fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "sftp://$FTP_SERVER" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          mirror $OPTS ./dist/ "$REMOTE_DIR"
          bye
          EOF

; Configuration PHP pour le développement local uniquement (npm run php).
; Les hébergements (OVH…) fournissent déjà ces extensions.
extension_dir = "ext"
extension = mbstring
extension = fileinfo
upload_max_filesize = 20M
post_max_size = 40M
max_file_uploads = 20
date.timezone = Europe/Paris
display_errors = On
error_reporting = E_ALL
